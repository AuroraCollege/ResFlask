<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Roster{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <nav class="container py-3 border-bottom mb-3">
      <ul class="nav">
        <li class="nav-item">
          <a
            class="nav-link{% if request.endpoint == 'index' %} active{% endif %}"
            href="{{ url_for('index') }}"
            >Staff</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link{% if request.endpoint == 'full' %} active{% endif %}"
            href="{{ url_for('full') }}"
            >Full roster</a
          >
        </li>
        <li class="nav-item">
          <button
            type="button"
            class="nav-link{% if request.endpoint == 'group' %} active{% endif %}"
            data-bs-toggle="menu"
            aria-expanded="false"
          >
            Year
          </button>
          <div class="menu">
            {% for year in r.groups %}
            <a class="menu-item" href="{{ url_for('group', year=year) }}"
              >Year {{ year }}</a
            >
            {% endfor %}
          </div>
        </li>
      </ul>
    </nav>
    <div class="container">{% block content %}{% endblock %}</div>
  </body>
</html>
