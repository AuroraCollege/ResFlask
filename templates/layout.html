<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Roster{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <nav class="container py-3 border-bottom mb-3">
      <ul class="nav">
        <li class="nav-item">
          <a
            class="nav-link{% if request.endpoint == 'index' %} active{% endif %}"
            href="{{ url_for('index') }}"
            >Staff</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link{% if request.endpoint == 'full' %} active{% endif %}"
            href="{{ url_for('full') }}"
            >Full roster</a
          >
        </li>
        <li class="nav-item">
          <button
            type="button"
            class="nav-link{% if request.endpoint == 'group' %} active{% endif %}"
            data-bs-toggle="menu"
            aria-expanded="false"
          >
            Year
          </button>
          <div class="menu">
            {% for year in r.groups %}
            <a class="menu-item" href="{{ url_for('group', year=year) }}"
              >Year {{ year }}</a
            >
            {% endfor %}
          </div>
        </li>

        <li class="nav-item">
          <button
            type="button"
            class="nav-link{% if request.endpoint == 'maps' %} active{% endif %}"
            data-bs-toggle="menu"
            aria-expanded="false"
          >
            Maps
          </button>
          <div class="menu">
            {% for site in ["Narrabeen", "Collaroy"] %}
            <a class="menu-item" href="{{ url_for('maps', site=site) }}"
              >{{ site }}</a
            >
            {% endfor %}
          </div>
        </li>

        <li class="nav-item" hidden>
          <a class="nav-link" id="pinned-link" href="#"></a>
        </li>
      </ul>
    </nav>
    <div class="container">{% block content %}{% endblock %}</div>
    <script>
      // Pinned staff page lives in this browser's localStorage (no server needed)
      (function () {
        var key = "pinnedStaff";
        var link = document.getElementById("pinned-link");
        var button = document.getElementById("pin-button");
        var pinned = null;
        try {
          pinned = JSON.parse(localStorage.getItem(key));
        } catch (e) {}

        function render() {
          link.parentElement.hidden = !pinned;
          if (pinned) {
            link.href = pinned.url;
            link.textContent = pinned.name;
            link.classList.toggle("active", pinned.url === location.pathname);
          }
          if (button) {
            var isPinned = !!pinned && pinned.url === button.dataset.url;
            button.textContent = isPinned ? "Unpin" : "Pin to nav";
            button.setAttribute("aria-pressed", isPinned);
          }
        }

        if (button) {
          button.addEventListener("click", function () {
            var isPinned = !!pinned && pinned.url === button.dataset.url;
            pinned = isPinned
              ? null
              : { url: button.dataset.url, name: button.dataset.name };
            try {
              if (pinned) localStorage.setItem(key, JSON.stringify(pinned));
              else localStorage.removeItem(key);
            } catch (e) {}
            render();
          });
        }

        render();
      })();
    </script>
  </body>
</html>
