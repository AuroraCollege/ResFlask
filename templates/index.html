{% extends "layout.html" %}

{% block content %}
<h1>Staff</h1>
<div class="row row-cols-auto g-3 py-4">
  {% for staff in r.staff.values() | sort(attribute="name") %}
  <div class="col">
    <a
      href="{{ url_for('staff', number=staff.number) }}"
      class="d-block h-100 p-3 border rounded text-decoration-none"
    >
      {{ staff.name }}
    </a>
  </div>
  {% endfor %}
</div>
{% endblock %}
