<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Roster</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="sm:container">
      <h1>Staff</h1>
      <div class="list-group col-4 py-4">
        {% for staff in r.staff.values() %}
        <a
          href="/staff/{{ staff.number }}"
          class="list-group-item list-group-item-action"
          aria-current="true"
        >
          {{ staff.name }}
        </a>

        {% endfor %}
      </div>

      <h1>Roster</h1>

      <div class="container text-center">
        {% for duty in r.duties %}
        <div class="row">
          <div class="col">{{ r.names(duty.staff) | join(", ") }}</div>
          <div class="col">{{ duty.duty }}</div>
          <div class="col">{{ duty.start }}–{{ duty.end }}</div>
        </div>
        {% endfor %}
      </div>
    </div>
  </body>
</html>
